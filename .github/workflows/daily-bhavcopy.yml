name: Daily bhavcopy update

# Keeps the committed bhavcopy day-file store current between manual review runs.
# Runs Tue-Sat 08:00 IST (02:30 UTC) and fetches the previous day: yesterday's
# end-of-day file is always published by then, so the exact minute does not matter -
# which is good, because GitHub's scheduled runs are best-effort and can drift.
#
# Tue-Sat because fetching "yesterday" on those days covers trading days Mon-Fri;
# running Sun/Mon would only ever reach a weekend. The job self-heals gaps anyway:
# it fetches every day since the last one in the cache, so a skipped run is filled
# by the next.
#
# Email: no custom mail is configured. GitHub automatically emails the repo owner
# when a scheduled workflow fails, and the updater exits non-zero only on a real
# fetch error, so that is exactly when you want to hear about it. Holidays and
# no-op days succeed quietly and are recorded in logs/daily_bhavcopy_update.csv.
on:
  schedule:
    - cron: "37 2,3 * * 2-6"   # 08:07 , 09:07 IST Tue-Sat
  workflow_dispatch:

# No concurrency guard. Overlapping runs are made safe in the commit step (it rebases
# onto the remote before pushing) rather than forbidden, so a run can never be stalled
# waiting behind another - which is what a stuck/ghost queued run would otherwise do.

# Needed so the job can commit the new day files and the log back to the repo.
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update bhavcopy cache
        id: update
        run: python scripts/daily_bhavcopy_update.py

      # Commit whatever was fetched plus the log row, even if the updater reported an
      # error on some day - the partial progress and the error record are both worth
      # keeping, and the job still ends failed (below) so the failure email fires.
      - name: Commit new day files and log
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Stage each path independently and tolerantly: a single `git add` with a
          # pathspec that matches nothing (e.g. the log before its first run) fails
          # the whole command under `bash -e`, which is what broke the first run.
          git add cache/bhavcopy 2>/dev/null || true
          git add logs 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Daily bhavcopy update ($(date -u +%Y-%m-%d))"
          # Race-proof push: rebase our commit onto whatever is already on the branch,
          # then push. Retried because another run (or a manual push) could land a
          # commit between our fetch and our push. This is what replaces the old
          # concurrency guard - concurrent runs rebase past each other instead of one
          # failing on a non-fast-forward, and no run waits in a queue behind another.
          branch="${{ github.ref_name }}"
          for attempt in 1 2 3; do
            git rebase --abort 2>/dev/null || true   # clear any half-done rebase from a prior attempt
            if git pull --rebase origin "$branch" && git push origin "HEAD:$branch"; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push attempt $attempt failed (someone else pushed?); retrying..."
            sleep 5
          done
          echo "Could not push after 3 attempts."
          exit 1
