name: Review Phase 2 — Daily watch

# Runs every weekday during the price window, tracking which names appear
# consistently across prices and cut-off dates.
#
# QUARTERLY UPDATE REQUIRED:
#   Change the cron expression to the weekdays of the price window.
#   List them explicitly to avoid the cron "OR" problem with day-of-month + day-of-week.
#
#   Feb 2027: Jan 18-29 → "0 4 18,19,20,21,22,25,26,27,28,29 1 *"
#   May 2027: Apr 17-30 → "0 4 17,20,21,22,23,24,27,28,29,30 4 *"
#   Aug 2027: Jul 17-30 → "0 4 17,18,21,22,23,24,25,28,29,30 7 *"
#   Nov 2027: Oct 18-29 → "0 4 18,19,20,21,22,25,26,27,28,29 10 *"
#
# Runs at 04:00 UTC (09:30 IST) — after the daily bhavcopy action (02:30 UTC)
# so prices for yesterday are already in the cache when this runs.
#
# Results append to out/<review>/daily_watch.csv and are committed each day.
on:
  schedule:
    - cron: "0 4 18,19,20,21,22,25,26,27,28,29 1 *"  # Jan 18-29, 09:30 IST — UPDATE EACH QUARTER
  workflow_dispatch:
    inputs:
      review:
        description: "Review label (e.g. 2027-02)"
        default: "2027-02"
      min_days:
        description: "Minimum run-days to list a name"
        default: "5"

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Rebuild price panels from committed day files
        run: python scripts/hydrate_panels.py

      - name: Run daily watch
        run: |
          python scripts/phase2_daily.py \
            --review "${{ github.event.inputs.review || '2027-02' }}" \
            --min-days "${{ github.event.inputs.min_days || '5' }}"

      - name: Commit daily watch output
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add out/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Daily watch — ${{ github.event.inputs.review || '2027-02' }} $(date -u +%Y-%m-%d)"
          branch="${{ github.ref_name }}"
          for attempt in 1 2 3; do
            git rebase --abort 2>/dev/null || true
            if git pull --rebase origin "$branch" && git push origin "HEAD:$branch"; then
              exit 0
            fi
            sleep 5
          done
          exit 1
